document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n \" hint-placeholder-count=\"4\"><span class=\"tag tag-neutral\">{{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n    <\u002Fsection><\u002Fsc-if>\n\n    <sc-if value=\"{{ showResearch }}\" hint-placeholder-val=\"{{ false }}\"><section id=\"research\" data-screen-label=\"Research\">\n      <div style=\"display:flex;align-items:center;gap:var(--space-4);border-top:3px solid transparent;border-image:var(--grad) 1;border-left:0;border-right:0;border-bottom:2px solid var(--color-divider);padding:var(--space-3) 0\">\n        <span style=\"font-size:12px;color:var(--color-accent);font-weight:800;width:28px\">03<\u002Fspan>\n        <h2 style=\"margin:0;font-size:22px;flex:1\">Research &amp; publications<\u002Fh2>\n              <\u002Fdiv>\n        <div style=\"padding:var(--space-4) 0 var(--space-8)\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:var(--space-4);padding:var(--space-4) 0;border-bottom:1px solid var(--color-divider)\">\n            <div><div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent);font-weight:600;margin-bottom:var(--space-1)\">Research<\u002Fdiv><h4 style=\"margin:0;font-size:16px\">Computational materials, Arizona State University<\u002Fh4><div style=\"font-size:12px;color:var(--color-neutral-700);margin-top:2px\">Research Assistant · 2014–2015<\u002Fdiv><\u002Fdiv>\n            <ul style=\"margin:0;padding-left:18px;font-size:14px;line-height:1.55\"><li>Developed a nonlinear finite-element C++ code to model high-cycle fatigue crack propagation in brittle polycrystalline materials.<\u002Fli><li style=\"margin-top:4px\">Implemented an SVPN-based numerical method in FORTRAN to determine the microscopic yield (Peierls) stress in solder and pure titanium.<\u002Fli><\u002Ful>\n          <\u002Fdiv>\n          <sc-for list=\"{{ pubs }}\" as=\"e\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:var(--space-4);padding:var(--space-4) 0;border-bottom:1px solid var(--color-divider)\">\n              <div style=\"font-size:12px;font-weight:600\">{{ e.yr }}<\u002Fdiv>\n              <div><h4 style=\"margin:0;font-size:16px;line-height:1.3\">{{ e.title }}<\u002Fh4><div style=\"font-size:13px;color:var(--color-neutral-700);margin-top:4px\">{{ e.authors }}<\u002Fdiv><div style=\"font-size:13px;margin-top:2px;font-style:italic\">{{ e.venue }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <a class=\"btn btn-ghost\" href=\"https://scholar.google.com/citations?user=LwKLpmwAAAAJ&amp;hl=en\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:var(--space-3)\">All publications on Google Scholar <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 3h6v6\"><\u002Fpath><path d=\"M10 14 21 3\"><\u002Fpath><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n    <\u002Fsection><\u002Fsc-if>\n\n    <sc-if value=\"{{ showProjects }}\" hint-placeholder-val=\"{{ false }}\"><section id=\"projects\" data-screen-label=\"Projects\">\n      <div style=\"display:flex;align-items:center;gap:var(--space-4);border-top:3px solid transparent;border-image:var(--grad) 1;border-left:0;border-right:0;border-bottom:2px solid var(--color-divider);padding:var(--space-3) 0\">\n        <span style=\"font-size:12px;color:var(--color-accent);font-weight:800;width:28px\">04<\u002Fspan>\n        <h2 style=\"margin:0;font-size:22px;flex:1\">Interactive projects<\u002Fh2>\n              <\u002Fdiv>\n        <div style=\"padding:var(--space-4) 0 var(--space-8)\">\n          <p style=\"font-size:14px;color:var(--color-neutral-700);max-width:640px;margin:var(--space-2) 0 var(--space-4)\">Browser-based engineering tools, running live below. Each has a Python companion in its repository.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;border:1px solid var(--color-divider);border-bottom:0\">\n            <sc-for list=\"{{ projects }}\" as=\"pr\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ pr.select }}\" style=\"flex:1 1 200px;text-align:left;background:{{ pr.bg }};color:{{ pr.fg }};border:0;border-bottom:1px solid var(--color-divider);border-right:1px solid var(--color-divider);padding:var(--space-3) var(--space-4);font:inherit;font-weight:800;font-size:14px;cursor:pointer\" style-hover=\"color:var(--color-accent)\">{{ pr.title }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:var(--space-6);padding:var(--space-4) 0 var(--space-6)\">\n            <div>\n              <h3 style=\"margin:0 0 var(--space-2);font-size:20px;line-height:1.2\">{{ current.title }}<\u002Fh3>\n              <p style=\"font-size:14px;line-height:1.55;margin:0 0 var(--space-3)\">{{ current.desc }}<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--space-4)\"><sc-for list=\"{{ current.tags }}\" as=\"t\" hint-placeholder-count=\"3\"><span class=\"tag tag-accent\">{{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-2);align-items:flex-start\">\n                <a class=\"btn btn-primary\" href=\"{{ current.demo }}\" target=\"_blank\" rel=\"noopener\">Open full screen <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 3h6v6\"><\u002Fpath><path d=\"M10 14 21 3\"><\u002Fpath><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n                <a class=\"btn btn-secondary\" href=\"{{ current.repo }}\" target=\"_blank\" rel=\"noopener\">Source on GitHub<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:3px;background:var(--grad);min-width:0\">\n              <iframe key=\"{{ current.demo }}\" src=\"{{ current.demo }}\" title=\"{{ current.title }}\" loading=\"lazy\" style=\"display:block;width:100%;height:{{ demoHeight }}px;border:0;background:#fff\"><\u002Fiframe>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-divider);padding-top:var(--space-4)\">\n            <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:var(--space-3)\">More on GitHub<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--color-divider);border:1px solid var(--color-divider)\">\n              <sc-for list=\"{{ moreRepos }}\" as=\"r\" hint-placeholder-count=\"6\">\n                <a href=\"{{ r.url }}\" target=\"_blank\" rel=\"noopener\" style=\"display:block;background:var(--color-bg);padding:var(--space-3);font-size:13px\" style-hover=\"background:var(--color-accent-100)\"><div style=\"font-weight:800;margin-bottom:2px\">{{ r.name }}<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:12px;line-height:1.4\">{{ r.desc }}<\u002Fdiv><\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <a class=\"btn btn-ghost\" href=\"https://github.com/aiden-azarnoush?tab=repositories\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:var(--space-3)\">All 16 repositories<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n    <\u002Fsection><\u002Fsc-if>\n\n\n    <sc-if value=\"{{ showEducation }}\" hint-placeholder-val=\"{{ false }}\"><section id=\"education\" data-screen-label=\"Education\">\n      <div style=\"display:flex;align-items:center;gap:var(--space-4);border-top:3px solid transparent;border-image:var(--grad) 1;border-left:0;border-right:0;border-bottom:2px solid var(--color-divider);padding:var(--space-3) 0\">\n        <span style=\"font-size:12px;color:var(--color-accent);font-weight:800;width:28px\">05<\u002Fspan>\n        <h2 style=\"margin:0;font-size:22px;flex:1\">Education<\u002Fh2>\n              <\u002Fdiv>\n        <div style=\"padding:var(--space-4) 0 var(--space-8)\">\n          <sc-for list=\"{{ education }}\" as=\"e\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:var(--space-4);padding:var(--space-4) 0;border-bottom:1px solid var(--color-divider)\">\n              <div style=\"font-size:12px;font-weight:600\">{{ e.yr }}<\u002Fdiv>\n              <div><h4 style=\"margin:0;font-size:16px\">{{ e.deg }}<\u002Fh4><div style=\"font-size:13px;color:var(--color-neutral-700);margin-top:2px\">{{ e.school }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n    <\u002Fsection><\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;darkMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;showPhoto&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sidebar&quot;},&quot;demoHeight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:620,&quot;min&quot;:360,&quot;max&quot;:1000,&quot;step&quot;:20,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Projects&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p){ super(p); this.state = { open: null, active: 'about', proj: 0, dark: true }; }\n  applyTheme(dark){ document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); }\n  keys = ['about','experience','research','projects','education'];\n  labels = ['About me','Professional experience','Research & publications','Interactive projects','Education'];\n  caps = { about:'About', experience:'Experience', research:'Research', projects:'Projects', education:'Education' };\n  componentDidMount(){\n    let dark = false;\n    try { const s = localStorage.getItem('aa-theme'); dark = s ? s === 'dark' : (this.props.darkMode ?? true); } catch (e) {}\n    const hash = (location.hash || '').slice(1);\n    this.applyTheme(dark); this.setState({ dark, active: this.keys.includes(hash) ? hash : 'about' });\n  }\n  renderVals(){\n    const v = { showPhoto: this.props.showPhoto ?? true, demoHeight: this.props.demoHeight ?? 620, isDark: this.state.dark, isLight: !this.state.dark,\n      toggleDark: () => { const d = !this.state.dark; this.applyTheme(d); try { localStorage.setItem('aa-theme', d ? 'dark' : 'light'); } catch (e) {} this.setState({ dark: d }); } };\n    this.keys.forEach(k => { v['show' + this.caps[k]] = this.state.active === k; });\n    v.sections = this.keys.map((k, i) => ({\n      href: '#' + k, num: String(i + 1).padStart(2, '0'), label: this.labels[i],\n      dot: this.state.active === k ? 1 : 0, dotColor: 'var(--grad)',\n      go: (e) => { e.preventDefault(); history.replaceState(null, '', '#' + k); this.setState({ active: k }); window.scrollTo({ top: 0 }); }\n    }));\n    const projects = [\n      { title: '3σ Steinberg Limit', demo: 'https://aiden-azarnoush.github.io/3_sigma_steinberg_limit/', repo: 'https://github.com/aiden-azarnoush/3_sigma_steinberg_limit', desc: \"Steinberg's relative displacement limits for PCB-mounted components — the standard check for whether a component survives 20 million stress cycles in random vibration or a shock event. Pick the component type and board position, enter the board dimensions, and read the limits with an optional margin of safety.\", tags: ['Vibration', 'PCB', 'JavaScript', 'Python GUI + CLI'] },\n      { title: 'Plasticity Yield Criteria', demo: 'https://aiden-azarnoush.github.io/plasticity-yielding-criteria/', repo: 'https://github.com/aiden-azarnoush/plasticity-yielding-criteria', desc: 'Tresca, von Mises and Drucker-Prager drawn in 3D principal stress space (drag to rotate), in 2D plane stress, and in the deviatoric π-plane. Set the yield stress or Drucker-Prager constants and switch views. Python and MATLAB versions in the repository.', tags: ['Plasticity', 'Plotly 3D', 'JavaScript', 'Python', 'MATLAB'] },\n      { title: '3D Steady-State Heat Transfer', demo: 'https://aiden-azarnoush.github.io/3d-steady-state-heat-transfer-calculator/', repo: 'https://github.com/aiden-azarnoush/3d-steady-state-heat-transfer-calculator', desc: 'Steady-state heat transfer in a rectangular block: conduction, convection, radiation and solar heating, solved with a finite-volume scheme and shown as interactive 3D results.', tags: ['Heat transfer', 'Finite volume', 'JavaScript'] }\n    ];\n    v.projects = projects.map((p, i) => ({ title: p.title, select: () => this.setState({ proj: i }), bg: i === this.state.proj ? 'var(--grad)' : 'transparent', fg: i === this.state.proj ? '#0b0d11' : 'var(--color-text)' }));\n    v.current = projects[this.state.proj];\n    const gh = 'https://github.com/aiden-azarnoush/';\n    v.moreRepos = [\n      { name: 'physics-constrained-fluid-flow', desc: 'JAX physics-constrained deep learning for Navier-Stokes surrogates, no simulation data.' },\n      { name: 'j2-plasticity', desc: 'Implicit return-mapping J2 plasticity in NumPy with Armstrong-Frederick hardening.' },\n      { name: 'crystal_plasticity', desc: 'Busso flow rule with three hardening models and custom crystal orientations.' },\n      { name: 'svpn_model', desc: 'Semidiscrete Variational Peierls–Nabarro model for dislocation cores.' },\n      { name: 'lid-driven-cavity', desc: 'Fast DST Poisson + RK3 and red-black SOR vorticity-streamfunction solvers.' },\n      { name: 'liquid-cold-plate', desc: 'NTU-effectiveness cold plate design with Kays & London surface data.' },\n      { name: 'falkner-skan', desc: 'Wedge-flow boundary-layer solver, RK4 + shooting, optional Fortran port.' },\n      { name: 'poisson-mixed-bcs', desc: 'How Dirichlet, Neumann and Robin BCs change the finite-difference system.' },\n      { name: 'membrane-modes', desc: '2D wave equation on a membrane: mode shapes, nodal curves, animations.' },\n      { name: 'transient-conduction-estimator', desc: 'Biot check, lumped capacitance or one-term Heisler series.' }\n    ].map(r => ({ ...r, url: gh + r.name }));\n    v.companies = [\n      { name: 'Quest Defense Systems and Solutions', role: 'Pratt & Whitney Contractor · West Palm Beach, FL', dates: 'Jul 2022 – Present', projects: [\n        { title: 'Secondary Flow, Clearance & Thermal Analysis', pid: 'Thermal', text: 'Secondary flow and thermal analysis of high-pressure turbine hardware on quality notifications (QNs) — clearance and thermal-gradient studies across conduction, convection, and radiation, supporting seal and knife-edge work and engine-manual limit evaluations.', tags: ['ANSYS APDL', 'NX Simcenter 3D', 'FABL', 'BCON', 'Transient thermal'] },\n        { title: 'RTP Tool', pid: 'Structural', text: 'Built the RTP (Return-Through Tightness Parameter) tool to determine optimal tip-shroud configurations on PW4000 shrouded blades and disk sectors — running steady-stress, thermal, and modal analysis across operating conditions and evaluating thermal and modal allowances and margins for wear, creep, untwist, and tolerance.', tags: ['ANSYS APDL', 'Siemens NX', 'Steady Stress', 'Thermal', 'Modal'] },\n        { title: 'MISES Cascade-Analysis Wrapper', pid: 'Aero', text: 'Python wrapper for MIT MISES 2D cascade analysis that prepares the required input files across spanwise sections (ISET grid setup, ISES inviscid and viscous solutions) and extracts the results — removing manual setup from QN evaluations and standardizing outputs across the team.', tags: ['Python', 'MIT MISES', 'ISET / ISES', '2D cascade'] },\n        { title: 'LE/TE Blending Tool', pid: 'Computational aerodynamics', text: 'In-house LE/TE blending tool for turbine blade edges, later extended to surface blends. Supports multiple blend methods — sphere- and ellipsoid-based — with control over how deeply the blend penetrates toward the blade core, wrapped in a GUI for consistent, repeatable results across blade alloys.', tags: ['Python', 'GUI', 'Surface blending', 'Multi-alloy'] },\n        { title: 'Particle Ingestion Tool', pid: 'Numerical', text: 'Enhanced a legacy Monte Carlo particle-ingestion tool, adding a kinetic-energy-based dirt-breakup model and increasing the particle count to improve simulation fidelity.', tags: ['FORTRAN', 'Monte Carlo', 'Particle ingestion'] }\n      ] },\n      { name: 'McCormick Stevenson Corporation', role: 'Advanced Engineer · Clearwater, FL', dates: 'Oct 2021 – Mar 2022', projects: [\n        { title: 'Electronic Chassis Thermal Analysis', pid: 'Thermal', text: 'Thermal modeling of electronic chassis and housings across federal programs for the U.S. Army, Raytheon, and Boeing, at a model fidelity set by each customer:', bullets: ['Simplified model geometry to strip small features insignificant to the thermal result before meshing.', 'Built high-fidelity models by importing the full PCB stackup — layers, vias, and copper distribution — from ODB++ / ECAD files.', 'For reduced-fidelity work, modeled each circuit-card-assembly (CCA) component by its junction-to-case and junction-to-board thermal resistances and estimated effective board conductivity by hand calculation or in ANSYS.', 'Modeled extreme operating environments — space vacuum, solar loading, rainstorm, water immersion, varying elevation — in ANSYS Icepak, Fluent, CFX, and Steady-State Thermal.', 'Specified cooling solutions (component placement, fans, heat pipes, TIMs, surface coatings) and fed results into chassis redesign and optimization.'], tags: ['ANSYS Icepak', 'Fluent', 'CFX', 'SpaceClaim', 'CFD', 'ODB++ / ECAD', 'Heat Pipes', 'TIMs'] },\n        { title: 'Chassis Structural & Vibration Analysis', pid: 'Structural', bullets: ['Ran modal analysis to find each assembly’s natural modes and the direction it deflects — the first mode being critical and the basis for the vibration runs.', 'Performed random vibration in all three orthogonal axes from the acceleration spectral-density profile, using linear modal superposition with ~100 modes to capture at least 86% of the modal mass.', 'Found the maximum deflection of each surface-mount component along worst-case paths and predicted margins of safety for all parts.', 'Performed shock and drop-test analysis from the shock profile in the X and Y directions.', 'Ran static, dynamic, and differential-pressure analysis, and determined fatigue life and margin of safety for chassis and PCBs.'], tags: ['ANSYS Mechanical', 'Modal analysis', 'Random vibration', 'Shock / drop', 'Fatigue'] }\n      ] },\n      { name: 'Arizona State University', role: 'Research Assistant · Tempe, AZ', dates: 'Jan 2014 – Mar 2015', projects: [\n        { title: 'Computational Materials Research', pid: 'Research', bullets: ['Developed a nonlinear finite-element C++ code to model high-cycle fatigue crack propagation in brittle polycrystalline materials.', 'Implemented an SVPN-based numerical method in FORTRAN to determine the microscopic yield (Peierls) stress in solder and pure titanium.'], tags: ['C++', 'FORTRAN', 'Nonlinear FEA', 'SVPN / Peierls stress'] }\n      ] }\n    ];\n    v.pubs = [\n      { yr: '2017', title: 'Dislocation Core Properties of β-tin: A First-Principles Study', authors: 'Bhatia, Azarnoush, Adlakha, Lu, Solanki', venue: 'Modelling and Simulation in Materials Science and Engineering, 25(2)' },\n      { yr: '2015', title: 'A First-Principles Investigation of Dislocation Core Properties of β-tin', authors: 'Azarnoush, Bhatia, Lu, Solanki', venue: 'Proceedings of the TMS, Orlando, FL' },\n      { yr: '2015', title: 'Effect of Oxygen on Prismatic Faults in α-Ti: A Combined QM/MM Study', authors: 'Bhatia, Zhang, Azarnoush, Lu, Solanki', venue: 'Scripta Materialia, 98, 32–35' }\n    ];\n    v.disciplines = ['Thermal & Fluid Analysis', 'Heat Transfer', 'FEA', 'Thermal-Mechanical', 'CFD', 'Secondary Flow Analysis'];\n    v.software = [{ label: 'CAD', text: 'NX CAD · SolidWorks · ANSYS SpaceClaim · PTC Creo' }, { label: 'FEA', text: 'ANSYS Workbench · Mechanical APDL · Abaqus · MSC Nastran/Patran' }, { label: 'CFD / Thermal', text: 'ANSYS Fluent · CFX · Icepak · Thermal Desktop · Simcenter 3D' }];\n    v.languages = ['Python', 'MATLAB', 'C / C++', 'FORTRAN 90/95', 'Julia', 'Perl'];\n    v.education = [{ yr: '2022–2025', deg: 'M.S., Mechanical Engineering', school: 'Purdue University — focus: computational fluid mechanics & machine learning' }, { yr: '2013–2016', deg: 'M.S., Mechanical Engineering', school: 'University of South Florida — focus: computational solid mechanics' }, { yr: '2010–2012', deg: 'M.S., Metal Forming', school: 'Sharif University of Technology' }, { yr: '2006–2010', deg: 'B.S., Materials Science & Engineering', school: 'Sharif University of Technology' }];\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
